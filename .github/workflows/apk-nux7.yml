name: APK Radio NUX7

# Buduje plik APK i wystawia go do pobrania jako wydanie "najnowsza".
# Strona nux7.com pobiera aplikację właśnie z tego wydania.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "serwer/**"
      - "docs/**"
      - "**.md"

permissions:
  contents: write

concurrency:
  group: apk-nux7
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0

      - name: Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Budowanie APK
        env:
          NUMER: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew -Papp.versionName="0.1.$NUMER" -Papp.versionCode="$((100 + NUMER))" :app:assembleGithubRelease --stacktrace
          ls -la app/build/outputs/apk/github/release/
          cp "$(ls app/build/outputs/apk/github/release/*.apk | head -n 1)" radio-nux7.apk
          ls -la radio-nux7.apk

      - name: Wystawienie do pobrania
        env:
          GH_TOKEN: ${{ github.token }}
          NUMER: ${{ github.run_number }}
        run: |
          if ! gh release view najnowsza >/dev/null 2>&1; then
            gh release create najnowsza --title "Radio NUX7 – najnowsza wersja" --notes "Najnowsza wersja aplikacji Radio NUX7 do zainstalowania na Androidzie."
          fi
          gh release upload najnowsza radio-nux7.apk --clobber
          gh release edit najnowsza --notes "Najnowsza wersja aplikacji Radio NUX7 do zainstalowania na Androidzie. Wersja 0.1.$NUMER."
