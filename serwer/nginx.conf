server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Zawsze sprawdzaj, czy jest nowsza wersja strony i aplikacji.
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";

    location / {
        # Dzięki temu działają adresy bez końcówki: /sluchaj i /admin.
        try_files $uri $uri.html $uri/ =404;
    }
}
