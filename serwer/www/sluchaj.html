<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070707">
<title>Radio NUX7 – słuchaj w przeglądarce</title>
<meta name="description" content="Polskie stacje radiowe w przeglądarce. Ten sam wygląd i te same ulubione co w aplikacji Radio NUX7.">
<link rel="icon" type="image/png" href="ikona.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --tlo: #0b0a09; --tekst: #f5f2ec; --cichy: #d6d2ca; --akcent: #e3c27e; --na-akcencie: #171208;
  --ramka: rgba(255,255,255,0.22); --linia: rgba(255,255,255,0.14);
  --szeryf: "Cormorant Garamond", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--tlo); color: var(--tekst); font: 16px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
[hidden] { display: none !important; }
.tlo { position: fixed; inset: 0; width: 100%; height: 100%; }

.szklo { background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.07)); border: 1px solid var(--ramka); -webkit-backdrop-filter: blur(22px) saturate(120%); backdrop-filter: blur(22px) saturate(120%); }

/* Układ: na komputerze pasek zakładek z boku, na telefonie na dole, jak w aplikacji. */
.aplikacja { position: relative; height: 100%; display: grid; grid-template-columns: 104px 1fr; grid-template-rows: 1fr auto; }
.pasek { grid-row: 1 / span 2; margin: 16px 0 16px 16px; border-radius: 32px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 8px; }
.pasek img { width: 44px; height: 44px; border-radius: 12px; margin-bottom: 14px; }
.zakladka { width: 100%; min-height: 64px; border: 0; border-radius: 22px; background: transparent; color: var(--cichy); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; }
.zakladka[aria-current="page"] { color: var(--akcent); }
.zakladka.dol { margin-top: auto; }
.widok { overflow-y: auto; padding: 28px 32px 24px; }
.srodek { max-width: 980px; margin-inline: auto; }
.dolny { padding: 0 32px 16px; }
.dolny .srodek { display: flex; flex-direction: column; gap: 10px; }

.marka { font-size: 12px; font-weight: 600; letter-spacing: 0.32em; color: var(--akcent); }
h1 { margin: 10px 0 0; font-family: var(--szeryf); font-weight: 500; font-size: clamp(38px, 5vw, 54px); line-height: 1.05; }
.panel { margin-top: 16px; padding: 16px; border-radius: 28px; }
.naglowek { display: flex; align-items: center; justify-content: space-between; min-height: 28px; }
.etykieta { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.24em; color: var(--cichy); }
.etykieta.zlota { color: var(--akcent); margin: 24px 6px 0; }
.link { border: 0; background: none; padding: 8px; color: var(--akcent); font-size: 13px; border-radius: 12px; }
.pusto { margin: 8px 0 4px; color: var(--cichy); font-size: 14px; }

.kolka { display: flex; flex-wrap: wrap; gap: 14px 22px; margin-top: 10px; }
.kolko { width: 84px; border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: var(--cichy); border-radius: 16px; }
.kolko span:last-child { max-width: 84px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kolko.gra { color: var(--tekst); }
.logo { flex: none; width: 46px; height: 46px; border-radius: 24%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3); display: grid; place-items: center; font-size: 10px; font-weight: 600; letter-spacing: 0.05em; overflow: hidden; }
.logo.duze { width: 72px; height: 72px; font-size: 13px; }
.logo.wielkie { width: 168px; height: 168px; font-size: 34px; border-width: 2px; border-color: var(--akcent); }
.gra > .logo, .gra .logo.duze { border: 1.5px solid var(--akcent); }
.logo img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.25s ease; }

.wiersze { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); column-gap: 28px; }
.wiersz { display: flex; align-items: center; min-height: 66px; border-top: 1px solid var(--linia); }
.wiersz .wlacz { flex: 1; min-width: 0; min-height: 66px; display: flex; align-items: center; gap: 14px; border: 0; background: none; padding: 0; text-align: left; border-radius: 14px; }
.nazwy { min-width: 0; flex: 1; }
.nazwy b { display: block; font-family: var(--szeryf); font-weight: 600; font-size: 21px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nazwy span { display: block; font-size: 12px; color: var(--cichy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gra .nazwy span { color: var(--akcent); }
.ikona-przycisk { flex: none; width: 48px; height: 48px; border: 0; border-radius: 50%; background: none; color: var(--cichy); display: grid; place-items: center; }
.ikona-przycisk[aria-pressed="true"] { color: var(--akcent); }
.ikona-przycisk[aria-pressed="true"] svg { fill: currentColor; }
.graj-znak { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--ramka); display: grid; place-items: center; color: var(--akcent); margin-right: 4px; }

.szukaj { margin-top: 16px; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 18px; border-radius: 26px; }
.szukaj input { flex: 1; min-width: 0; height: 48px; border: 0; outline: 0; background: transparent; }
.szukaj input::placeholder { color: var(--cichy); }
.filtry { margin-top: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.filtry button { min-height: 44px; border-radius: 22px; font-size: 13px; font-weight: 500; }
.filtry button[aria-pressed="true"] { background: var(--akcent); border-color: transparent; color: var(--na-akcencie); font-weight: 600; -webkit-backdrop-filter: none; backdrop-filter: none; }

.mini { display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 0 10px; border-radius: 34px; background: linear-gradient(180deg, rgba(255,255,255,0.2), rgba(255,255,255,0.12)); }
.mini .otworz { flex: 1; min-width: 0; min-height: 68px; display: flex; align-items: center; gap: 12px; border: 0; background: none; padding: 0; text-align: left; }
.mini .nazwy b { font-family: inherit; font-size: 15px; font-weight: 500; }
.mini .nazwy span { color: var(--akcent); }
.kolo { flex: none; width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--akcent); color: var(--na-akcencie); display: grid; place-items: center; }
.kolo.wielkie { width: 80px; height: 80px; }
.glosnosc { width: 120px; accent-color: var(--akcent); }
.pasek-dolny { display: none; }

.odtwarzacz { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; padding: 24px; overflow-y: auto; }
.odtwarzacz > * { flex: none; }
.odtwarzacz .gora { width: min(560px, 100%); display: flex; align-items: center; justify-content: space-between; }
.okragly { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
.na-zywo { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.28em; color: var(--akcent); }
.na-zywo i { width: 6px; height: 6px; border-radius: 50%; background: var(--akcent); }
.pierscien { position: relative; flex: none; margin: auto 0 0; width: 272px; height: 272px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 50% 38%, #1d1d1f, #0b0b0c 72%); box-shadow: 0 26px 60px rgba(0,0,0,0.65), 0 2px 0 rgba(255,255,255,0.06); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.pierscien:active { cursor: grabbing; }
.pierscien:focus-visible { outline: 2px solid var(--akcent); outline-offset: 4px; }
.pierscien > svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.pierscien .tor { fill: none; stroke: rgba(255,255,255,0.14); stroke-width: 5; stroke-linecap: round; }
.pierscien .poziom { fill: none; stroke: url(#pk-zloto); stroke-width: 5; stroke-linecap: round; }
.pierscien .poziom.blask { stroke: var(--akcent); stroke-width: 9; opacity: 0.6; }
.pierscien .galka-cien { fill: none; }
.pierscien .galka { fill: #fff3cf; stroke: var(--akcent); stroke-width: 1.5; filter: drop-shadow(0 0 5px var(--akcent)); }
.pierscien .galka-srodek { fill: none; }
.pierscien .kreski line { stroke: rgba(255,255,255,0.22); stroke-width: 1.2; stroke-linecap: round; }
.pierscien .kreski line.duza { stroke: rgba(255,255,255,0.5); stroke-width: 1.6; }
.pierscien .kreski line.zapalona { stroke: var(--akcent); }
.tarcza { position: relative; width: 182px; height: 182px; border-radius: 50%; display: grid; place-items: center; background: repeating-conic-gradient(from 0deg, rgba(255,255,255,0.045) 0deg 0.6deg, rgba(0,0,0,0.05) 0.6deg 1.4deg), conic-gradient(from 35deg, #2d2d2f, #0e0e0f 22%, #343436 50%, #0e0e0f 76%, #2d2d2f); box-shadow: 0 12px 28px rgba(0,0,0,0.7), inset 0 1px 1px rgba(255,255,255,0.22), inset 0 -1px 1px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,0,0,0.7); pointer-events: none; }
.tarcza > * { grid-area: 1 / 1; transition: opacity 0.18s ease; }
.tarcza .procent { opacity: 0; display: grid; justify-items: center; gap: 6px; color: #f5e8cf; }
.tarcza .procent b { font: 300 44px/1 Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.pierscien.reguluje .logo.wielkie { opacity: 0; }
.pierscien.reguluje .procent { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .tarcza > * { transition: none; } }
.tarcza .logo.wielkie { width: 116px; height: 116px; border-width: 1px; border-color: rgba(255,255,255,0.22); box-shadow: 0 6px 18px rgba(0,0,0,0.55); }
.ile-glosno { flex: none; height: 18px; margin: 10px 0 auto; font-size: 12px; letter-spacing: 0.14em; color: var(--cichy); opacity: 0; transition: opacity 0.4s ease; }
.ile-glosno.widac { opacity: 1; }

.tematy { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
.tematy button { min-height: 40px; padding: 0 16px; border-radius: 20px; font-size: 13px; font-weight: 500; }
.tematy button[aria-pressed="true"] { background: var(--akcent); border-color: transparent; color: var(--na-akcencie); font-weight: 600; -webkit-backdrop-filter: none; backdrop-filter: none; }
.wiadomosci { margin-top: 4px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.wiadomosc { display: flex; flex-direction: column; border-radius: 28px; overflow: hidden; text-decoration: none; color: var(--tekst); margin-top: 0; }
.wiadomosc.glowna { grid-column: 1 / -1; }
.wiadomosc .zdjecie { aspect-ratio: 16 / 9; background: linear-gradient(135deg, rgba(255,255,255,0.14), rgba(0,0,0,0.3)); overflow: hidden; }
.wiadomosc.glowna { flex-direction: row; align-items: stretch; }
.wiadomosc.glowna .zdjecie { flex: 0 0 52%; aspect-ratio: 16 / 9; }
.wiadomosc.glowna .opis { flex: 1; justify-content: center; padding: 20px 24px; }
.wiadomosc .zdjecie img { width: 100%; height: 100%; object-fit: cover; object-position: center 22%; display: block; }
.wiadomosc .opis { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; }
.wiadomosc .skad { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: var(--akcent); text-transform: uppercase; }
.wiadomosc .skad span { color: var(--cichy); font-weight: 400; letter-spacing: 0; text-transform: none; }
.wiadomosc b { font-family: var(--szeryf); font-weight: 600; font-size: 21px; line-height: 1.15; }
.wiadomosc.glowna b { font-size: clamp(25px, 3vw, 34px); }
.wiadomosc .wstep { font-size: 13px; line-height: 1.45; color: var(--cichy); }
.wiadomosc:hover b { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.odtwarzacz .panel { width: min(560px, 100%); text-align: center; padding: 24px 16px 20px; margin: 0; }
.odtwarzacz h2 { margin: 0; font-family: var(--szeryf); font-weight: 500; font-size: 38px; line-height: 1.05; }
.odtwarzacz p { margin: 4px 0 0; color: var(--cichy); font-size: 14px; }
.odtwarzacz .utwor { margin-top: 8px; font-family: var(--szeryf); font-style: italic; font-size: 22px; line-height: 1.15; color: var(--tekst); }
.odtwarzacz .wykonawca { font-size: 14px; color: var(--cichy); }
.grane { width: min(560px, 100%); text-align: left !important; padding: 16px !important; margin-top: 12px !important; }
.grane ol { margin: 6px 0 0; padding: 0; list-style: none; max-height: 220px; overflow: auto; }
.grane li { display: flex; gap: 12px; padding: 8px 0; border-top: 1px solid var(--linia); font-size: 14px; }
.grane li:first-child { border-top: 0; }
.grane li time { flex: none; width: 44px; color: var(--cichy); font-variant-numeric: tabular-nums; }
.grane li span { color: var(--cichy); }
.fala { margin: 18px auto 0; height: 36px; display: flex; align-items: center; justify-content: center; gap: 5px; max-width: 300px; }
.fala i { flex: none; width: 2px; height: var(--h); border-radius: 1px; background: var(--akcent); transform-origin: center; animation: fala 1.1s ease-in-out infinite alternate; animation-delay: var(--d); }
.fala i.dalej { background: rgba(214,210,202,0.45); }
.fala.stoi i { animation-play-state: paused; transform: scaleY(0.3); }
@keyframes fala { from { transform: scaleY(0.3); } to { transform: scaleY(1); } }
@media (prefers-reduced-motion: reduce) { .fala i { animation: none; } }
.kolo.wielkie { box-shadow: 0 10px 30px color-mix(in srgb, var(--akcent) 35%, transparent); }
.wylacznik-opis { margin: 10px 0 0 !important; color: var(--akcent) !important; font-size: 13px !important; }
.kafelki { flex: none; width: min(560px, 100%); margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.kafel { min-height: 60px; border-radius: 22px; padding: 0 16px; display: flex; align-items: center; gap: 12px; text-align: left; color: var(--tekst); }
.kafel .znak { color: var(--akcent); display: grid; place-items: center; }
.kafel small { display: block; font-size: 10px; font-weight: 600; letter-spacing: 0.18em; color: var(--cichy); }
.kafel b { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kafel[disabled] { opacity: 0.45; }
.sterowanie { margin-top: 14px; display: flex; align-items: center; justify-content: space-between; }

.opcja { display: flex; align-items: center; gap: 12px; min-height: 60px; }
.opcja + .opcja { border-top: 1px solid var(--linia); }
.motywy { display: flex; gap: 6px 18px; flex-wrap: wrap; margin-top: 12px; }
.motyw { width: 66px; border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: var(--cichy); border-radius: 14px; }
.motyw i { width: 56px; height: 56px; border-radius: 50%; border: 2px solid transparent; display: grid; place-items: center; }
.motyw i::after { content: ""; width: 42px; height: 42px; border-radius: 50%; background: var(--k); }
.motyw[aria-pressed="true"] { color: var(--tekst); font-weight: 600; }
.motyw[aria-pressed="true"] i { border-color: var(--tekst); }
.pole-imie { width: 100%; max-width: 420px; height: 48px; border: 0; border-bottom: 1px solid rgba(255,255,255,0.45); background: transparent; outline: 0; font-size: 16px; }
.podglad { margin: 4px 0 0; font-family: var(--szeryf); font-weight: 500; font-size: 24px; }
.przycisk { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 24px; border-radius: 24px; border: 0; background: var(--akcent); color: var(--na-akcencie); font-weight: 600; text-decoration: none; }
.przycisk.drugi { background: transparent; border: 1px solid var(--ramka); color: var(--tekst); }

dialog { width: min(420px, 100% - 32px); padding: 32px 24px 24px; border-radius: 28px; border: 1px solid var(--ramka); background: #1a1917; color: var(--tekst); }
dialog::backdrop { background: rgba(0,0,0,0.7); }
dialog h3 { margin: 0; font-family: var(--szeryf); font-weight: 500; font-size: 38px; line-height: 1.05; }
dialog label { display: block; margin-top: 18px; font-size: 11px; font-weight: 600; letter-spacing: 0.2em; color: var(--cichy); }
dialog input { width: 100%; height: 48px; border: 0; border-bottom: 1px solid rgba(255,255,255,0.45); background: transparent; outline: 0; }
dialog .przycisk { width: 100%; margin-top: 22px; min-height: 56px; }
.komunikat { min-height: 1.5em; margin: 12px 0 0; font-size: 14px; color: #f0a8a0; }

@media (max-width: 760px) {
  .aplikacja { grid-template-columns: 1fr; }
  .pasek { display: none; }
  .widok { padding: 22px 16px 16px; }
  .dolny { padding: 0 16px 12px; }
  .pasek-dolny { display: flex; min-height: 64px; border-radius: 32px; padding: 0 8px; }
  .pasek-dolny .zakladka { flex: 1; }
  .wiadomosc.glowna { flex-direction: column; }
  .wiadomosc.glowna .zdjecie { flex: none; }
  .wiadomosc.glowna .opis { padding: 14px 16px 16px; }
  .filtry { grid-template-columns: repeat(2, 1fr); }
  .glosnosc { display: none; }
  .kolka { justify-content: space-between; gap: 14px 8px; }
  .kolko { width: 76px; }
}
</style>
</head>
<body>

<svg class="tlo" aria-hidden="true" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2a2a"/><stop offset="1" stop-color="#0e0e0e"/></linearGradient>
    <linearGradient id="p2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#232323"/><stop offset="1" stop-color="#0a0a0a"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1b1b1b"/><stop offset="1" stop-color="#333333"/></linearGradient>
  </defs>
  <polygon points="0,0 210,0 150,130 0,190" fill="url(#p1)"/>
  <polygon points="210,0 390,0 390,150 260,210 150,130" fill="url(#p2)"/>
  <polygon points="0,190 150,130 260,210 190,370 0,330" fill="url(#p3)"/>
  <polygon points="260,210 390,150 390,420 300,440 190,370" fill="url(#p1)"/>
  <polygon points="0,330 190,370 140,560 0,520" fill="url(#p2)"/>
  <polygon points="190,370 300,440 280,620 140,560" fill="url(#p3)"/>
  <polygon points="300,440 390,420 390,680 280,620" fill="url(#p2)"/>
  <polygon points="0,520 140,560 110,760 0,720" fill="url(#p1)"/>
  <polygon points="140,560 280,620 250,844 90,844 110,760" fill="url(#p2)"/>
  <polygon points="280,620 390,680 390,844 250,844" fill="url(#p3)"/>
  <polygon points="0,720 110,760 90,844 0,844" fill="url(#p3)"/>
  <path fill="none" stroke="#000" stroke-width="3" vector-effect="non-scaling-stroke" d="M210 0L150 130L0 190M150 130L260 210L390 150M260 210L190 370L0 330M190 370L300 440L390 420M190 370L140 560L0 520M300 440L280 620L140 560M280 620L390 680M140 560L110 760L0 720M110 760L90 844M280 620L250 844"/>
</svg>

<div class="aplikacja">
  <nav class="pasek szklo" aria-label="Zakładki">
    <a href="./" aria-label="Strona główna Radia NUX7"><img src="ikona.png" alt="" width="44" height="44"></a>
    <button class="zakladka" type="button" data-zakladka="start"></button>
    <button class="zakladka" type="button" data-zakladka="stacje"></button>
    <button class="zakladka" type="button" data-zakladka="ulubione"></button>
    <button class="zakladka" type="button" data-zakladka="wiadomosci"></button>
    <button class="zakladka dol" type="button" data-zakladka="opcje"></button>
  </nav>

  <main class="widok" id="widok"><div class="srodek" id="tresc"></div></main>

  <div class="dolny">
    <div class="srodek">
      <div class="mini szklo" id="mini" hidden>
        <button class="otworz" id="otworz" type="button" aria-label="Otwórz odtwarzacz">
          <span class="logo" id="mini-logo"></span>
          <span class="nazwy"><b id="mini-nazwa"></b><span id="mini-stan">Na żywo</span></span>
        </button>
        <input class="glosnosc" id="glosnosc" type="range" min="0" max="1" step="0.05" value="1" aria-label="Głośność">
        <button class="kolo" id="mini-graj" type="button" aria-label="Pauza"></button>
      </div>
      <nav class="pasek-dolny szklo" aria-label="Zakładki">
        <button class="zakladka" type="button" data-zakladka="start"></button>
        <button class="zakladka" type="button" data-zakladka="stacje"></button>
        <button class="zakladka" type="button" data-zakladka="ulubione"></button>

<script>
(function () {
  var IKONY = {
    start: '<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/>',
    stacje: '<path d="M5 7h14M5 12h14M5 17h9"/>',
    ulubione: '<path d="M12 20s-7-4.400-7-10a4 4 0 0 1 7-2.500A4 4 0 0 1 19 10c0 5.600-7 10-7 10z"/>',
    wiadomosci: '<rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9h8M8 13h8M8 16h5"/>',
    opcje: '<path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.500"/><circle cx="8" cy="17" r="2.500"/>',
    szukaj: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.800-3.800"/>',
    wdol: '<path d="M6 9l6 6 6-6"/>',
    zegar: '<circle cx="12" cy="13.500" r="7"/><path d="M12 13.500V9.500M12 13.500l2.800 1.600M9.500 3.500h5"/>',
    nuty: '<path d="M4 7h10M4 12h7M4 17h5"/><path d="M15 17.500V8l5-1.500v9"/><circle cx="13.200" cy="17.500" r="1.800"/><circle cx="18.200" cy="15.500" r="1.800"/>'
  };
  var PELNE = {
    graj: '<path d="M8 5v14l11-7z"/>',
    pauza: '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>',
    poprzednia: '<path d="M19 6v12l-9-6z"/><rect x="5" y="6" width="2.200" height="12" rx="1"/>',
    nastepna: '<path d="M5 6v12l9-6z"/><rect x="16.800" y="6" width="2.200" height="12" rx="1"/>'
  };
  var NAZWY = { start: 'Start', stacje: 'Stacje', ulubione: 'Ulubione', wiadomosci: 'Wiadomości', opcje: 'Opcje' };
  var MOTYWY = [['zloto', 'Złoto', '#e3c27e'], ['platyna', 'Platyna', '#e4e8ec'], ['miedz', 'Miedź', '#d9916a'], ['szmaragd', 'Szmaragd', '#5fb898'], ['szafir', 'Szafir', '#86adeb']];
  var FILTRY = [['wszystkie', 'Wszystkie'], ['bezgadania', 'Bez gadania'], ['polski', 'Tylko po polsku']];

  var stacje = [], wczytano = false, konto = null, grana = null, zakladka = 'start', filtr = 'wszystkie', szukane = '';
  var niegra = false; // stacja nie odpowiedziała
  var dzwiek = document.getElementById('dzwiek');
  var tresc = document.getElementById('tresc');

  function ikona(sciezki, rozmiar) {
    return '<svg aria-hidden="true" width="' + rozmiar + '" height="' + rozmiar + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + sciezki + '</svg>';
  }
  function pelna(sciezki, rozmiar) {
    return '<svg aria-hidden="true" width="' + rozmiar + '" height="' + rozmiar + '" viewBox="0 0 24 24" fill="currentColor">' + sciezki + '</svg>';
  }
  function el(znacznik, klasa, tekst) {
    var e = document.createElement(znacznik);
    if (klasa) e.className = klasa;
    if (tekst !== undefined) e.textContent = tekst;
    return e;
  }
  function pamiec(nazwa, wartosc) {
    try {
      if (wartosc === undefined) return localStorage.getItem(nazwa);
      if (wartosc === null) localStorage.removeItem(nazwa); else localStorage.setItem(nazwa, wartosc);
    } catch (e) { return null; }
  }
  function lista(nazwa) { try { return JSON.parse(pamiec(nazwa) || '[]'); } catch (e) { return []; } }
  if (FILTRY.some(function (f) { return f[0] === pamiec('nux7-filtr'); })) filtr = pamiec('nux7-filtr');
  function klucz() { return pamiec('nux7-klucz'); }
  // Bez konta i bez własnego wyboru pokazujemy cztery stacje na start, jak w aplikacji.
  function ulubione() {
    if (konto) return konto.ulubione || [];
    return pamiec('nux7-ulubione') === null ? ['rmf-5', 'zet', 'eska-2380', 'antyradio'] : lista('nux7-ulubione');
  }
  function imie() { return konto ? (konto.imie || '') : (pamiec('nux7-imie') || ''); }
  function znajdz(id) { for (var i = 0; i < stacje.length; i++) if (stacje[i].id === id) return stacje[i]; return null; }
  function powitanie() {
    var godzina = new Date().getHours();
    var pora = godzina >= 5 && godzina < 18 ? 'Dzień dobry' : 'Dobry wieczór';
    return imie().trim() ? pora + ', ' + imie().trim() : pora;
  }

  function api(sciezka, opcje) {
    opcje = opcje || {};
    opcje.headers = Object.assign({ 'Content-Type': 'application/json' }, opcje.headers || {});
    if (klucz()) opcje.headers.Authorization = 'Bearer ' + klucz();
    return fetch('/api/' + sciezka, opcje).then(function (o) {
      return o.json().catch(function () { return {}; }).then(function (d) {
        if (!o.ok) throw new Error(d.blad || 'Nie udało się połączyć z serwerem.');
        return d;
      });
    });
  }

  function skrot(nazwa) {
    return (nazwa.replace(/^(Radio|RMF|ESKA|Antyradio|Polskie Radio)\s+/i, '') || nazwa).slice(0, 4).toUpperCase();
  }
  function wstawLogo(element, stacja) {
    element.textContent = '';
    if (!stacja.logo) { element.textContent = skrot(stacja.nazwa); return; }
    var obraz = document.createElement('img');
    obraz.alt = '';
    obraz.decoding = 'async';
    obraz.onload = function () {
      // Malutkie ikonki po powiększeniu są rozmyte, więc zamiast nich pokazujemy skrót nazwy.
      if (obraz.naturalWidth < 64 || obraz.naturalHeight < 64) { element.textContent = skrot(stacja.nazwa); return; }
      // Szerokie albo wysokie logo pokazujemy w całości, żeby nie ucinać napisu.
      var proporcja = obraz.naturalWidth / obraz.naturalHeight;
      if (proporcja < 0.87 || proporcja > 1.15) { obraz.style.objectFit = 'contain'; obraz.style.padding = '8%'; }
      obraz.style.opacity = '1';
    };
    obraz.onerror = function () { element.textContent = skrot(stacja.nazwa); };
    obraz.src = stacja.logo;
    element.appendChild(obraz);
  }

  // ---------- Elementy listy ----------

  function wiersz(stacja, zSercem) {
    var w = el('div', 'wiersz');
    w.dataset.stacja = stacja.id;
    var wlacz = el('button', 'wlacz');
    wlacz.type = 'button';
    wlacz.setAttribute('aria-label', 'Włącz ' + stacja.nazwa);
    var znak = el('span', 'logo');
    wstawLogo(znak, stacja);
    var nazwy = el('span', 'nazwy');
    nazwy.appendChild(el('b', '', stacja.nazwa));
    var opis = el('span', '', stacja.opis);
    opis.dataset.opis = stacja.opis;
    nazwy.appendChild(opis);
    wlacz.appendChild(znak);
    wlacz.appendChild(nazwy);
    wlacz.addEventListener('click', function () { graj(stacja); });
    w.appendChild(wlacz);
    if (zSercem) {
      var serce = el('button', 'ikona-przycisk');
      serce.type = 'button';
      serce.dataset.serce = stacja.id;
      serce.innerHTML = ikona(IKONY.ulubione, 20);
      serce.addEventListener('click', function () { przelaczUlubiona(stacja.id); });
      w.appendChild(serce);
    } else {
      var graj2 = el('span', 'graj-znak');
      graj2.innerHTML = pelna(PELNE.graj, 14);
      w.appendChild(graj2);
    }
    return w;
  }

  function panel(tytul, zloty) {
    var p = el('section', 'panel szklo');
    if (tytul) {
      var n = el('div', 'naglowek');
      var e = el('h2', 'etykieta', tytul);
      if (zloty) e.style.color = 'var(--akcent)';
      n.appendChild(e);
      p.appendChild(n);
      p.naglowek = n;
    }
    return p;
  }

  // ---------- Widoki ----------

  function widokStart() {
    tresc.appendChild(el('div', 'marka', 'RADIO NUX7'));
    tresc.appendChild(el('h1', '', powitanie()));

    var moje = ulubione().map(znajdz).filter(Boolean);
    var p1 = panel('ULUBIONE');
    var wszystkie = el('button', 'link', 'Wszystkie');
    wszystkie.type = 'button';
    wszystkie.addEventListener('click', function () { idz('ulubione'); });
    p1.naglowek.appendChild(wszystkie);
    if (!moje.length) {
      p1.appendChild(el('p', 'pusto', wczytano ? 'Dodaj ulubione stacje serduszkiem na liście stacji.' : 'Wczytuję stacje…'));
    } else {
      var kolka = el('div', 'kolka');
      moje.slice(0, 10).forEach(function (s) {
        var k = el('button', 'kolko');
        k.type = 'button';
        k.dataset.stacja = s.id;
        k.setAttribute('aria-label', 'Włącz ' + s.nazwa);
        var znak = el('span', 'logo duze');
        wstawLogo(znak, s);
        k.appendChild(znak);
        k.appendChild(el('span', '', s.nazwa));
        k.addEventListener('click', function () { graj(s); });
        kolka.appendChild(k);
      });
      p1.appendChild(kolka);
    }
    tresc.appendChild(p1);

    var ostatnie = lista('nux7-ostatnie').map(znajdz).filter(Boolean);
    if (ostatnie.length) {
      var p2 = panel('OSTATNIO SŁUCHANE');
      var w = el('div', 'wiersze');
      ostatnie.slice(0, 6).forEach(function (s) { w.appendChild(wiersz(s, false)); });
      p2.appendChild(w);
      tresc.appendChild(p2);
    }
  }

  function widokStacje() {
    tresc.appendChild(el('div', 'marka', 'RADIO NUX7'));
    tresc.appendChild(el('h1', '', 'Stacje'));

    var pole = el('label', 'szukaj szklo');
    pole.innerHTML = '<span style="color:var(--cichy); display:grid">' + ikona(IKONY.szukaj, 20) + '</span>';
    var wpis = document.createElement('input');
    wpis.type = 'search';
    wpis.placeholder = 'Szukaj stacji lub gatunku';
    wpis.setAttribute('aria-label', 'Szukaj stacji lub gatunku');
    wpis.autocomplete = 'off';
    wpis.value = szukane;
    pole.appendChild(wpis);
    tresc.appendChild(pole);

    var filtry = el('div', 'filtry');
    FILTRY.forEach(function (f) {
      var b = el('button', 'szklo', f[1]);
      b.type = 'button';
      b.setAttribute('aria-pressed', filtr === f[0] ? 'true' : 'false');
      b.addEventListener('click', function () {
        filtr = f[0];
        pamiec('nux7-filtr', filtr);
        Array.prototype.forEach.call(filtry.children, function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
        rysujListe();
      });
      filtry.appendChild(b);
    });
    tresc.appendChild(filtry);

    var miejsce = el('div');
    tresc.appendChild(miejsce);

    function rysujListe() {
      miejsce.textContent = '';
      var fraza = szukane.trim().toLowerCase();
      var widoczne = stacje.filter(function (s) {
        if (filtr === 'bezgadania' && !s.bezGadania) return false;
        if (filtr === 'polski' && s.jezyk !== 'polski') return false;
        if (filtr === 'angielski' && s.jezyk !== 'angielski') return false;
        return !fraza || (s.nazwa + ' ' + s.grupa + ' ' + s.opis).toLowerCase().indexOf(fraza) >= 0;
      });
      if (!widoczne.length) {
        var p = panel();
        p.appendChild(el('p', 'pusto', wczytano ? 'Nie ma stacji pasujących do wyboru.' : 'Wczytuję stacje…'));
        miejsce.appendChild(p);
        return;
      }
      var grupy = {}, kolejnosc = [];
      widoczne.forEach(function (s) { if (!grupy[s.grupa]) { grupy[s.grupa] = []; kolejnosc.push(s.grupa); } grupy[s.grupa].push(s); });
      kolejnosc.forEach(function (nazwa) {
        var p = panel(nazwa.toUpperCase(), true);
        var w = el('div', 'wiersze');
        grupy[nazwa].forEach(function (s) { w.appendChild(wiersz(s, true)); });
        p.appendChild(w);
        miejsce.appendChild(p);
      });
      zaznacz();
    }
    wpis.addEventListener('input', function () { szukane = wpis.value; rysujListe(); });
    rysujListe();
  }

  function widokUlubione() {
    tresc.appendChild(el('div', 'marka', 'RADIO NUX7'));
    tresc.appendChild(el('h1', '', 'Ulubione'));
    var moje = ulubione().map(znajdz).filter(Boolean);
    var p = panel();
    if (!moje.length) {
      p.appendChild(el('p', 'pusto', wczytano ? 'Nie masz jeszcze ulubionych. Dotknij serduszka przy stacji na liście Stacje.' : 'Wczytuję stacje…'));
    } else {
      var w = el('div', 'wiersze');
      moje.forEach(function (s) { w.appendChild(wiersz(s, true)); });
      p.appendChild(w);
    }
    tresc.appendChild(p);
  }

  function widokOpcje() {
    tresc.appendChild(el('div', 'marka', 'RADIO NUX7'));
    tresc.appendChild(el('h1', '', 'Opcje'));

    tresc.appendChild(el('p', 'etykieta zlota', 'WYGLĄD'));
    var p1 = panel();
    p1.appendChild(el('div', '', 'Motyw kolorystyczny'));
    var motywy = el('div', 'motywy');
    var wybrany = pamiec('nux7-motyw') || 'zloto';
    MOTYWY.forEach(function (m) {
      var b = el('button', 'motyw');
      b.type = 'button';
      b.style.setProperty('--k', m[2]);
      b.setAttribute('aria-pressed', wybrany === m[0] ? 'true' : 'false');
      b.appendChild(el('i'));
      b.appendChild(el('span', '', m[1]));
      b.addEventListener('click', function () {
        pamiec('nux7-motyw', m[0]);
        ustawMotyw();
        Array.prototype.forEach.call(motywy.children, function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      });
      motywy.appendChild(b);
    });
    p1.appendChild(motywy);
    var kreska = el('div');
    kreska.style.cssText = 'height:1px; background:var(--linia); margin:18px 0 16px';
    p1.appendChild(kreska);
    var etykieta = el('label', '', 'Imię w powitaniu');
    etykieta.htmlFor = 'imie-opcje';
    etykieta.style.display = 'block';
    p1.appendChild(etykieta);
    var pole = el('input', 'pole-imie');
    pole.id = 'imie-opcje';
    pole.type = 'text';
    pole.maxLength = 30;
    pole.placeholder = 'Wpisz swoje imię';
    pole.value = imie();
    p1.appendChild(pole);
    var opis = el('p', '', 'Tak przywitamy Cię na ekranie Start');

  (function () {

    var SRODEK = 136, PROMIEN = 122, POCZATEK = 135, ZAKRES = 270, gasnie = null;

      var duza = k % 5 === 0;
      var p1 = punkt(POCZATEK + ZAKRES * k / LICZBA_KRESEK, duza ? 102 : 105), p2 = punkt(POCZATEK + ZAKRES * k / LICZBA_KRESEK, 110);
      kreski += '<line' + (duza ? ' class="duza"' : '') + ' x1="' + p1[0].toFixed(1) + '" y1="' + p1[1].toFixed(1) + '" x2="' + p2[0].toFixed(1) + '" y2="' + p2[1].toFixed(1) + '"/>';

      document.getElementById('pokretlo-blask').setAttribute('d', ksztalt);
      var g = punkt(kat, PROMIEN);
      document.getElementById('pokretlo-galka').setAttribute('transform', 'translate(' + g[0].toFixed(2) + ' ' + g[1].toFixed(2) + ')');
      Array.prototype.forEach.call(document.getElementById('pokretlo-kreski').children, function (kreska, numer) {
        kreska.classList.toggle('zapalona', v > 0 && numer / LICZBA_KRESEK <= v + 0.001);

    var id = pamiec('nux7-motyw') || 'zloto';
    var kolor = '#e3c27e';
    MOTYWY.forEach(function (m) { if (m[0] === id) kolor = m[2]; });
    document.documentElement.style.setProperty('--akcent', kolor);
  }
  document.querySelectorAll('[data-zakladka]').forEach(function (b) {
    b.innerHTML = ikona(IKONY[b.dataset.zakladka], 22) + '<span>' + NAZWY[b.dataset.zakladka] + '</span>';
    b.addEventListener('click', function () { idz(b.dataset.zakladka); });
  });
  document.getElementById('zwin').innerHTML = ikona(IKONY.wdol, 22);
  document.getElementById('do-opcji').innerHTML = ikona(IKONY.opcje, 20);
  document.getElementById('duze-serce').innerHTML = ikona(IKONY.ulubione, 26);
  document.getElementById('wylacznik').innerHTML = ikona(IKONY.zegar, 26);
  document.getElementById('kafel-grane-znak').innerHTML = ikona(IKONY.nuty, 22);
  document.getElementById('kafel-wiadomosci-znak').innerHTML = ikona(IKONY.wiadomosci, 22);
  (function () {
    var fala = document.getElementById('fala'), slupki = '';
    for (var n = 0; n < 33; n++) {
      var wys = Math.round(8 + 28 * Math.abs(Math.sin(n * 0.9 + 1.3)) * (1 - Math.abs(n - 16) / 33));
      slupki += '<i' + (n > 20 ? ' class="dalej"' : '') + ' style="--h:' + wys + 'px;--d:-' + ((n * 137) % 1100) + 'ms"></i>';
    }
    fala.innerHTML = slupki;
  })();
  document.getElementById('kafel-grane').addEventListener('click', function () {
    var pole = document.getElementById('grane');
    pole.hidden = !pole.hidden;
    this.setAttribute('aria-expanded', pole.hidden ? 'false' : 'true');
    document.getElementById('kafel-grane-napis').textContent = pole.hidden ? 'Zobacz utwory' : 'Zwiń listę';
  });
  document.getElementById('kafel-wiadomosci').addEventListener('click', function () { idz('wiadomosci'); });

  // Wyłącznik czasowy: kolejne kliknięcia ustawiają 15, 30, 60, 90 minut i wyłączają.
  (function () {
    var KROKI = [0, 15, 30, 60, 90], wybrany = 0, koniec = 0, zegar = null, licznik = null;
    var przycisk = document.getElementById('wylacznik'), opis = document.getElementById('wylacznik-opis');
    function pokaz() {
      var zostalo = koniec ? Math.max(1, Math.ceil((koniec - Date.now()) / 60000)) : 0;
      opis.hidden = !koniec;
      opis.textContent = koniec ? 'Radio wyłączy się za ' + zostalo + ' min' : '';
      przycisk.style.color = koniec ? 'var(--akcent)' : 'var(--tekst)';
      przycisk.setAttribute('aria-label', koniec ? 'Wyłącznik czasowy: ' + zostalo + ' minut' : 'Wyłącznik czasowy');
    }
    przycisk.addEventListener('click', function () {
      wybrany = (wybrany + 1) % KROKI.length;
      clearTimeout(zegar);
      clearInterval(licznik);
      koniec = KROKI[wybrany] ? Date.now() + KROKI[wybrany] * 60000 : 0;
      if (koniec) {
        zegar = setTimeout(function () { dzwiek.pause(); koniec = 0; wybrany = 0; clearInterval(licznik); pokaz(); zaznacz(); }, KROKI[wybrany] * 60000);
        licznik = setInterval(pokaz, 15000);
      }
      pokaz();
    });
  })();
  document.getElementById('poprzednia').innerHTML = pelna(PELNE.poprzednia, 28);
  document.getElementById('nastepna').innerHTML = pelna(PELNE.nastepna, 28);

  // ---------- Dane ----------

  function wczytajStacje() {
    return api('stacje').then(function (d) {
      // Przeglądarka nie odtworzy adresów bez szyfrowania na tej stronie.
      stacje = (d.stacje || []).filter(function (s) { return s.adres.indexOf('https://') === 0; });
      wczytano = true;
      if (grana) grana = znajdz(grana.id) || grana;
      rysuj();
    }).catch(function () { wczytano = true; rysuj(); });
  }

  // ---------- Logowanie ----------

  var okno = document.getElementById('okno'), rejestracja = false;
  function ustawTryb() {
    document.getElementById('okno-tytul').textContent = rejestracja ? 'Utwórz konto' : 'Witaj ponownie';
    document.getElementById('wyslij').textContent = rejestracja ? 'Utwórz konto' : 'Zaloguj się';
    document.getElementById('pytanie').textContent = rejestracja ? 'Masz już konto?' : 'Nie masz konta?';
    document.getElementById('zmien-tryb').textContent = rejestracja ? 'Zaloguj się' : 'Utwórz konto';
    document.getElementById('pole-imie-rej').hidden = !rejestracja;
    document.getElementById('haslo').autocomplete = rejestracja ? 'new-password' : 'current-password';
    document.getElementById('komunikat').textContent = '';
  }
  document.getElementById('zmien-tryb').addEventListener('click', function () { rejestracja = !rejestracja; ustawTryb(); });
  document.getElementById('zamknij').addEventListener('click', function () { okno.close(); });
  document.getElementById('formularz').addEventListener('submit', function (z) {
    z.preventDefault();
    var dane = { email: document.getElementById('email').value, haslo: document.getElementById('haslo').value };
    if (rejestracja) dane.imie = document.getElementById('imie-rej').value || imie();
    api(rejestracja ? 'konto/rejestracja' : 'konto/logowanie', { method: 'POST', body: JSON.stringify(dane) })
      .then(function (d) {
        pamiec('nux7-klucz', d.klucz);
        konto = d.konto;
        document.getElementById('haslo').value = '';
        okno.close();
        return wczytajStacje();
      })
      .catch(function (e) { document.getElementById('komunikat').textContent = e.message; });
  });

  ustawMotyw();
  rysuj();
  (klucz() ? api('konto').then(function (d) { konto = d.konto; }).catch(function () { pamiec('nux7-klucz', null); }) : Promise.resolve())
    .then(wczytajStacje);
})();
</script>
